  <link rel="stylesheet" href="assets/auriga.css" />
  <style>
    /* Landing-only chrome: starfield canvas + auriga corner label.
       The terminal is mounted by terminal.js; the Auriga constellation
       SVG is injected by /assets/constellation.js (kept off content
       pages so they don't ship D3 unless the user navigates back to /). */
    html, body { width: 100%; min-height: 100%; }
    body { overflow-x: hidden; }

    #stars-canvas { position: fixed; inset: 0; z-index: 0; }

    #auriga-label {
      position: fixed;
      bottom: 18px; right: 22px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(140, 190, 255, 0.22);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: aurigaLabelFade 1s ease 3.5s forwards;
    }
    @keyframes aurigaLabelFade { to { opacity: 1; } }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div id="auriga-label">Auriga · The Charioteer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="assets/auriga.js"></script>
<script src="assets/terminal.js"></script>
<script src="assets/constellation.js"></script>
<script>
window.addEventListener('load', function () {

  // Auriga constellation: animated reveal on direct / loads.
  // (SPA navigations back to / use { skipAnimation: true } via terminal.js.)
  if (window.Constellation) window.Constellation.render();

  /* ── TERMINAL ──
     One DOM element across the entire visit. Always mounts centered on
     this page; centered is the visual state of /, not a one-time
     animation. The intro typing only fires on the first visit; on hard
     refreshes / returns, the dock comes up centered with whatever
     restored history sessionStorage has. */
  const introDone = window.AurigaTerminal && window.AurigaTerminal.wasIntroDone();
  window.AurigaTerminal.mountDock({
    centered: true,
    intro:    !introDone,
    autoFocus: true,
  });

  // Hard reloads on bf-cache restore: keep the current behaviour.
  window.addEventListener('pageshow', e => { if (e.persisted) window.location.reload(); });
});
</script>

</body>
</html>
