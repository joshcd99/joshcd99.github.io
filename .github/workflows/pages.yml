name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repo root. The .spa-rewrite.mjs transformer
          # has already converted all internal URLs to base-relative and
          # injected a runtime <base> tag, so the same files work at the
          # root that GitHub Pages serves (this repo is named USERNAME.github.io, so it serves at /).
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
